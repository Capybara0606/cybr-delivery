[build]
  command = "npm run deploy:check && npm run build"
  publish = ".next"
  # Native-only changes must not consume a production web deployment credit.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- src public netlify netlify.toml package.json package-lock.json next.config.ts postcss.config.mjs tsconfig.json .nvmrc scripts"

[build.environment]
  NODE_VERSION = "24"
  TRUST_PROXY = "netlify"

[functions]
  directory = "netlify/functions"

# Next.js is detected automatically; Netlify provisions its OpenNext adapter.
# No paid add-ons, domains, databases or external services are provisioned here.
