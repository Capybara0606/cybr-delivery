name: Publish verified Android pilot
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Android driver APK run
        required: true
        default: '41561769339'
      source_sha:
        description: Exact source commit of the APK
        required: true
        default: '3e89b95891cfde12310224e638366abe24cbecda'
      release_tag:
        description: Pilot release tag
        required: true
        default: driver-v0.1.0-pilot
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify build succeeded for the exact source
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: cybr-driver-android-pilot
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Publish pilot APK for direct mobile download
        run: |
          mv artifact/app-release.apk CYBR-Repartidor-0.1.0-arm64.apk
          cat > release-notes.md <<'NOTES'
          Primera versión piloto Android ARM64 de CYBR Repartidor. Usa la demo Café Aurora y tu cuenta existente de repartidor.

          Login, turno, asignaciones, recogida/salida/llegada, navegación externa, cobro y código de entrega, historial y GPS nativo con permisos/aviso visible. Sin mapa embebido ni notificaciones push todavía.

          APK con JavaScript embebido: no requiere PC, Metro, Expo Go ni cuenta Expo. Firma de desarrollo para pruebas, no distribución productiva de Play Store. No contiene secretos de servidor.

          Compilación y firma verificadas; pruebas físicas de GPS con pantalla bloqueada/navegación pendientes. No se garantiza continuidad al forzar cierre de app.
          NOTES
          printf '\nFuente exacta: %s\nBuild: https://github.com/%s/actions/runs/%s\n\nSHA256:\n' "$SOURCE_SHA" "$GH_REPO" "$BUILD_RUN" >> release-notes.md
          sha256sum CYBR-Repartidor-0.1.0-arm64.apk >> release-notes.md
          gh release create "$RELEASE_TAG" CYBR-Repartidor-0.1.0-arm64.apk --prerelease --target "$SOURCE_SHA" --title 'CYBR Repartidor v0.1.0 · piloto Android' --notes-file release-notes.md
