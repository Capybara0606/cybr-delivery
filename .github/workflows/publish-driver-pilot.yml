name: Publish verified Android pilot
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Android driver APK run
        required: true
      source_sha:
        description: Exact source commit of the APK
        required: true
      release_tag:
        description: Pilot release tag
        required: true
        default: driver-v0.2.0-pilot
      app_version:
        description: APK version name
        required: true
        default: '0.2.0'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Verify build succeeded for the exact source
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: cybr-driver-android-pilot
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Publish pilot APK for direct mobile download
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK_NAME="CYBR-Repartidor-${APP_VERSION}-arm64.apk"
          mv artifact/app-release.apk "$APK_NAME"
          cat > release-notes.md <<'NOTES'
          Versión piloto Android ARM64 de CYBR Repartidor. Usa la demo Café Aurora y tu cuenta existente de repartidor.

          Corrige la recogida del pedido assigned y permite finalizar entrega con código/cobro. GPS automático durante todo el turno, incluso sin pedido; se detiene al cerrar turno o sesión. El cliente solo ve ubicación de su entrega en camino. Ubicación de turno privada; plan del panel admin documentado, todavía no habilitado. Requiere permisos y aviso visible del sistema. Sin mapa embebido ni notificaciones push todavía.

          APK con JavaScript embebido: no requiere PC, Metro, Expo Go ni cuenta Expo. Firma de desarrollo para pruebas, no distribución productiva de Play Store. No contiene secretos de servidor.

          Compilación y firma verificadas; pruebas físicas de GPS con pantalla bloqueada/navegación pendientes. No se garantiza continuidad al forzar cierre de app.
          NOTES
          printf '\nFuente exacta: %s\nBuild: https://github.com/%s/actions/runs/%s\n\nSHA256:\n' "$SOURCE_SHA" "$GH_REPO" "$BUILD_RUN" >> release-notes.md
          sha256sum "$APK_NAME" >> release-notes.md
          gh release create "$RELEASE_TAG" "$APK_NAME" --prerelease --target "$SOURCE_SHA" --title "CYBR Repartidor v${APP_VERSION} · piloto Android" --notes-file release-notes.md
